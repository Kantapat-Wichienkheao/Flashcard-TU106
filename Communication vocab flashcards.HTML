<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communication Vocabulary Flashcards</title>
<style>
  :root{
    --bg1:#0f1220; --bg2:#1a1f3a;
    --card-front:#ffffff; --card-back:#fef9f0;
    --accent:#7c5cff; --accent2:#ff8a5c;
    --text-dark:#1e1e2e; --text-mid:#4a4a5e; --text-light:#8888a0;
    --gold:#e0b64c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    color:#fff;
    padding:16px;
  }
  h1{
    font-size:1.4rem;
    margin:8px 0 4px;
    text-align:center;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  .subtitle{color:var(--text-light);font-size:.85rem;margin-bottom:14px;text-align:center;}

  .controls{
    width:100%;max-width:520px;
    display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;margin-bottom:14px;
  }
  select, input[type=text], button{
    font-family:inherit;font-size:.85rem;
    border-radius:10px;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:#fff;padding:8px 12px;
    cursor:pointer;
    outline:none;
  }
  select:focus, input[type=text]:focus{border-color:var(--accent);}
  input[type=text]{cursor:text;flex:1;min-width:140px;}
  button{transition:transform .12s,background .2s;}
  button:hover{background:rgba(255,255,255,.16);}
  button:active{transform:scale(.95);}
  button.primary{background:linear-gradient(90deg,var(--accent),#9b7bff);border:none;font-weight:600;}
  button.primary:hover{filter:brightness(1.1);}
  option{color:#111;}

  .progress-wrap{width:100%;max-width:520px;margin-bottom:10px;}
  .progress-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .25s;}
  .progress-label{font-size:.75rem;color:var(--text-light);margin-top:4px;text-align:center;}

  .stage{
    width:100%;max-width:520px;
    perspective:1600px;
    margin-bottom:16px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:340px;
    border-radius:20px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    border-radius:20px;
    display:flex;flex-direction:column;
    padding:24px;
    overflow-y:auto;
  }
  .face.front{
    background:linear-gradient(160deg,var(--card-front),#eef0ff);
    align-items:center;justify-content:center;
    text-align:center;
  }
  .face.back{
    background:linear-gradient(160deg,var(--card-back),#fff3e0);
    transform:rotateY(180deg);
    color:var(--text-dark);
  }
  .chip{
    display:inline-block;
    font-size:.7rem;font-weight:700;letter-spacing:.04em;
    color:#fff;background:var(--accent);
    padding:4px 10px;border-radius:999px;
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .front .term{
    font-size:1.6rem;font-weight:800;color:var(--text-dark);
    line-height:1.25;
  }
  .front .hint{
    margin-top:18px;font-size:.75rem;color:var(--text-light);
  }
  .back .short-thai{
    font-size:1.15rem;font-weight:700;color:var(--accent);
    background:rgba(124,92,255,.08);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    line-height:1.4;
  }
  .back .def-block{margin-bottom:12px;}
  .back .def-label{
    font-size:.7rem;font-weight:800;letter-spacing:.05em;
    color:var(--accent2);text-transform:uppercase;
    margin-bottom:4px;
  }
  .back .def-text{font-size:.92rem;line-height:1.5;color:var(--text-mid);}
  .back .def-text.thai{color:var(--text-dark);}

  .nav-row{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:520px;margin-bottom:8px;
  }
  .nav-row button{min-width:44px;font-size:1.1rem;padding:8px 14px;}
  .counter{font-size:.85rem;color:var(--text-light);min-width:70px;text-align:center;}

  .list-panel{
    width:100%;max-width:520px;
    margin-top:18px;
    background:rgba(255,255,255,.05);
    border-radius:16px;
    padding:12px;
    max-height:260px;
    overflow-y:auto;
  }
  .list-panel h3{margin:4px 8px 8px;font-size:.85rem;color:var(--text-light);}
  .word-chip{
    display:inline-block;font-size:.78rem;
    padding:6px 10px;margin:3px;border-radius:8px;
    background:rgba(255,255,255,.08);
    cursor:pointer;
  }
  .word-chip:hover{background:rgba(124,92,255,.3);}
  .word-chip.current{background:var(--accent);font-weight:700;}

  footer{color:var(--text-light);font-size:.72rem;margin:18px 0 6px;text-align:center;}

  @media (max-width:400px){
    .card{min-height:380px;}
    .front .term{font-size:1.35rem;}
  }
</style>
</head>
<body>

<h1>Communication Vocabulary Flashcards</h1>
<div class="subtitle" id="subtitle">Loading…</div>

<div class="controls">
  <select id="chapterSelect"></select>
  <input type="text" id="searchBox" placeholder="Search word…">
  <button id="shuffleBtn">🔀 Shuffle</button>
  <button id="resetBtn">↺ Reset order</button>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<div class="stage">
  <div class="card" id="card">
    <div class="face front">
      <div>
        <span class="chip" id="chapterChip">Chapter 1</span>
        <div class="term" id="frontTerm">Word</div>
        <div class="hint">Tap card to flip · use arrow keys</div>
      </div>
    </div>
    <div class="face back">
      <div class="short-thai" id="backShort">ความหมายสั้น</div>
      <div class="def-block">
        <div class="def-label">English Definition</div>
        <div class="def-text" id="backEng"></div>
      </div>
      <div class="def-block">
        <div class="def-label">Thai Definition</div>
        <div class="def-text thai" id="backThai"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav-row">
  <button id="prevBtn">◀ Prev</button>
  <div class="counter" id="counter">1 / 66</div>
  <button class="primary" id="flipBtn">Flip</button>
  <button id="nextBtn">Next ▶</button>
</div>

<div class="list-panel">
  <h3>Jump to a word</h3>
  <div id="wordList"></div>
</div>

<footer>Keyboard: ← → to navigate, Space/Enter to flip · Works fully offline</footer>

<script>
const CHAPTERS = [
{
  title: "Chapter 1",
  words: [
    {t:"Communication", short:"การสื่อสาร", eng:"A systemic process in which people interact with and through symbols to create and interpret meanings.", thai:"กระบวนการที่คนเราใช้สัญลักษณ์ต่างๆ มาคุยกันหรือปฏิสัมพันธ์กัน เพื่อสร้างและตีความหมายเรื่องราวร่วมกันอย่างเป็นระบบ"},
    {t:"Content level of meaning", short:"ความหมายระดับเนื้อหา", eng:"One of two levels of meaning; the literal information in a message.", thai:"ความหมายตรงตัวของข้อความหรือสารที่พูดออกไป (พูดอะไรก็หมายความตามนั้นเลย)"},
    {t:"Feedback", short:"ข้อมูลป้อนกลับ / การตอบกลับ", eng:"Verbal or nonverbal response to a message. The concept of feedback as applied to human communication appeared first in interactive models of communication.", thai:"การตอบกลับสาร ทั้งการพูดตอบ หรือการแสดงสีหน้าท่าทาง ซึ่งแนวคิดนี้เริ่มนำมาใช้ในแบบจำลองการสื่อสารแบบปฏิสัมพันธ์"},
    {t:"Homeostasis", short:"ภาวะสมดุล", eng:"A state of equilibrium that systems strive for but cannot sustain.", thai:"สภาวะสมดุลที่ระบบพยายามจะรักษาไว้ให้ได้ แต่ก็ไม่อาจคงอยู่แบบนั้นได้ตลอดเวลา"},
    {t:"Meaning", short:"ความหมาย", eng:"The significance we attribute to a phenomenon; what it signifies to us.", thai:"คุณค่าหรือความสำคัญที่เราให้กับสิ่งๆ หนึ่ง หรือความหมายที่สิ่งนั้นสื่อถึงตัวเรา"},
    {t:"Noise", short:"สิ่งรบกวนการสื่อสาร", eng:"Anything that interferes with the intended meaning of communication; includes sounds (e.g., traffic) as well as psychological interferences (e.g., preoccupation).", thai:"อะไรก็ตามที่มาขัดขวางไม่ให้สื่อสารกันเข้าใจ เช่น เสียงรถดังรบกวน หรือเรื่องกังวลใจที่ทำให้ฟังไม่รู้เรื่อง"},
    {t:"Openness", short:"ความเปิดกว้างของระบบ", eng:"The extent to which a system interacts with its surrounding environment.", thai:"ระดับที่ระบบหนึ่งๆ เปิดรับหรือมีปฏิสัมพันธ์กับสภาพแวดล้อมรอบข้างมากน้อยแค่ไหน"},
    {t:"Process", short:"กระบวนการที่ต่อเนื่อง", eng:"An ongoing continuity, the beginning and end of which are difficult to identify; for example, communication.", thai:"เรื่องที่ดำเนินไปอย่างต่อเนื่องเรื่อยๆ จนยากจะชี้ชัดว่าเริ่มตรงไหนและจบลงตรงไหน เหมือนกับการสื่อสาร"},
    {t:"Relationship level of meaning", short:"ความหมายระดับความสัมพันธ์", eng:"One of two levels of meaning in communication; expresses the relationship between communicators.", thai:"ความหมายที่ซ่อนอยู่หลังคำพูด ซึ่งบอกให้รู้ว่าคนที่คุยกันมีความสัมพันธ์ต่อกันยังไง (เช่น สนิทกัน สนิทมาก หรือเกรงใจกัน)"},
    {t:"Symbols", short:"สัญลักษณ์", eng:"An arbitrary, ambiguous, and abstract representation of a phenomenon. Symbols are the basis of language, much nonverbal behavior, and human thought.", thai:"สิ่งที่ใช้แทนความหมายของสิ่งต่างๆ ซึ่งมนุษย์สมมติขึ้นมาเอง มีความนัย และมีความคลุมเครืออยู่ในตัว เป็นรากฐานของภาษา ท่าทาง และความคิดของคนเรา"},
    {t:"System", short:"ระบบ", eng:"A group of interrelated elements that affect one another. Communication is systemic.", thai:"กลุ่มของสิ่งต่างๆ ที่เกี่ยวข้องกันและส่งผลกระทบถึงกันตลอด ซึ่งการสื่อสารก็ทำงานเป็นระบบแบบนี้เหมือนกัน"}
  ]
},
{
  title: "Chapter 2",
  words: [
    {t:"Critical research method", short:"การวิจัยเชิงวิพากษ์", eng:"A type of data analysis that aims to identify, critique, or change communication practices that oppress, marginalize, or otherwise harm people.", thai:"วิธีวิเคราะห์ข้อมูลที่มุ่งจับผิด ชี้ให้เห็น หรือแก้ไขการสื่อสารที่กดขี่ เอาเปรียบ หรือทำร้ายคนอื่นในสังคม"},
    {t:"Ethics", short:"จริยธรรม", eng:"The branch of philosophy that deals with the goodness or rightness of particular actions. Ethical issues infuse all areas of the communication field.", thai:"หลักความคิดเรื่องความถูกต้องเหมาะสมของการกระทำ ซึ่งเรื่องจริยธรรมนี้แทรกซึมอยู่ในทุกๆ ด้านของการสื่อสาร"},
    {t:"Ethos", short:"ความน่าเชื่อถือของผู้พูด", eng:"One of three forms of proof; proof based on the speaker's credibility (trustworthiness, expertise, and goodwill).", thai:"โน้มน้าวใจคนฟังด้วยความน่าเชื่อถือของผู้พูดเอง (เช่น ความเชี่ยวชาญ ความจริงใจ หรือความน่าไว้วางใจ)"},
    {t:"Interpersonal communication", short:"การสื่อสารระหว่างบุคคล", eng:"Communication between people, usually in close relationships such as friendship and romance.", thai:"การพูดคุยกันระหว่างคนสองคนขึ้นไป มักเกิดในความสัมพันธ์ที่ใกล้ชิด เช่น เพื่อนสนิทหรือคนรัก"},
    {t:"Intrapersonal communication", short:"การสื่อสารกับตัวเอง", eng:"Communication with ourselves, or self-talk.", thai:"การคุยกับตัวเอง หรือความคิดในหัวของตัวเอง"},
    {t:"Logos", short:"การใช้เหตุผลและตรรกะ", eng:"One of three forms of proof; proof based on logic and reasoning.", thai:"โน้มน้าวใจคนฟังด้วยตรรกะ เหตุผล และข้อเท็จจริง"},
    {t:"Organizational culture", short:"วัฒนธรรมองค์กร", eng:"Understandings about identity and codes of thought and action that are shared by the members of an organization.", thai:"ความเข้าใจร่วมกันของคนในองค์กรเกี่ยวกับตัวตน วิธีคิด และกติกาการทำงานที่คนในนั้นยึดถือเหมือนกัน"},
    {t:"Pathos", short:"การเล่นกับอารมณ์ความรู้สึก", eng:"One of three forms of proof; proof based on appealing to listeners' emotions.", thai:"โน้มน้าวใจคนฟังโดยการกระตุ้นหรือจูงใจอารมณ์ความรู้สึกของผู้ฟัง"},
    {t:"Qualitative research methods", short:"วิจัยเชิงคุณภาพ", eng:"Interpretive techniques, including textual analysis and ethnography, used to understand the character of experience, particularly how people perceive and make sense of communication.", thai:"วิธีศึกษาเน้นเนื้องานและการตีความ (เช่น ถอดบทสัมภาษณ์ เจาะลึกวิถีชีวิต) เพื่อเข้าใจว่าคนเราตีความและให้ความหมายกับการสื่อสารอย่างไร"},
    {t:"Quantitative research methods", short:"วิจัยเชิงปริมาณ", eng:"Techniques such as descriptive statistics, surveys, and experiments, used to gather quantifiable data.", thai:"วิธีศึกษาเน้นตัวเลขและสถิติ (เช่น ทำแบบสอบถาม การทดลอง) เพื่อรวบรวมข้อมูลที่วัดผลได้ชัดเจน"},
    {t:"Triangulation", short:"การตรวจสอบข้อมูลจากหลายมุม", eng:"Studying phenomena from multiple points of view by relying on multiple sources of data, theories, researchers, and/or methodological approaches.", thai:"การศึกษาเรื่องใดเรื่องหนึ่งจากหลายๆ มุม โดยใช้แหล่งข้อมูล ทฤษฎี หรือวิธีวิจัยหลายๆ แบบมาร่วมกัน เพื่อให้ผลลัพธ์แม่นยำที่สุด"}
  ]
},
{
  title: "Chapter 3",
  words: [
    {t:"Attribution", short:"การเดาสาเหตุพฤติกรรม", eng:"An explanation of why things happen and why people act as they do; not necessarily correct interpretations of others and their motives.", thai:"การพยายามอธิบายว่าทำไมเรื่องนี้ถึงเกิดขึ้น หรือทำไมคนนั้นถึงทำแบบนั้น ซึ่งเราอาจจะเดาเจตนาเขาผิดก็ได้"},
    {t:"Cognitive complexity", short:"ความซับซ้อนทางความคิด", eng:"The number of mental constructs an individual uses, how abstract they are, and how elaborately they interact to create perceptions.", thai:"ความสามารถในการคิดวิเคราะห์ที่มีหลายมิติ ยิ่งมีสูงก็ยิ่งมองคนหรือสถานการณ์ได้ละเอียดลึกซึ้ง ไม่มองอะไรแบบตื้นๆ"},
    {t:"Cognitive schemata", short:"กรอบความคิดในหัว", eng:"Mental structures people use to organize and interpret experience. Four schemata have been identified: prototypes, personal constructs, stereotypes, and scripts.", thai:"โครงสร้างความคิดในสมองที่คนเราใช้จัดระบบและตีความสิ่งที่เจอ ประกอบด้วย 4 รูปแบบหลัก (Prototypes, Personal constructs, Stereotypes และ Scripts)"},
    {t:"Constructivism", short:"ทฤษฎีการสร้างความรู้/การจัดระบบความคิด", eng:"A theory that holds that we organize and interpret experience by applying cognitive structures called schemata.", thai:"ทฤษฎีที่บอกว่าคนเราเข้าใจสิ่งต่างๆ รอบตัวได้ เพราะเราใช้กรอบความคิด (Schemata) ในหัวมาช่วยจัดระเบียบและตีความ"},
    {t:"Culture", short:"วัฒนธรรม", eng:"The beliefs, understandings, practices, and ways of interpreting experience that are shared by a group of people.", thai:"ความเชื่อ ความเข้าใจ และวิถีชีวิตที่กลุ่มคนกลุ่มหนึ่งยึดถือและใช้ตีความเรื่องราวต่างๆ ร่วมกัน"},
    {t:"Empathy", short:"การเอาใจเขามาใส่ใจเรา", eng:"The ability to feel with another person, to feel what he or she feels in a situation.", thai:"ความสามารถในการรับรู้และรู้สึกไปพร้อมกับคนอื่น อินไปกับสิ่งที่เขาเจอในสถานการณ์นั้นๆ"},
    {t:"Expectancy violation theory", short:"ทฤษฎีเมื่อคนอื่นทำไม่ตรงกับที่เราคิด", eng:"A theory claiming that when our expectations are violated, we become more cognitively alert as we struggle to understand and cope with unexpected behaviors.", thai:"ทฤษฎีที่อธิบายว่า พอมีใครทำตัวหลุดไปจากสิ่งที่เราคาดหวัง เราจะตื่นตัวขึ้นมาทันทีเพื่อพยายามเข้าใจว่าทำไมเขาถึงทำแบบนั้น"},
    {t:"Individualism", short:"นิยามการยึดถือความเป็นตัวเอง / ปัจเจกนิยม", eng:"A predominant Western value that regards each person as unique, important, and to be recognized for her or his individual qualities and behavior.", thai:"ค่านิยมที่ให้ความสำคัญกับตัวบุคคล มองว่าทุกคนมีเอกลักษณ์เฉพาะตัว มีอิสระ และควรได้รับการยอมรับจากผลงานหรือการกระทำของตัวเอง"},
    {t:"Inference", short:"การอนุมาน / การคิดเอาเองจากเบาะแส", eng:"An interpretation that goes beyond the facts known but is believed to logically follow from them.", thai:"การตีความต่อยอดไปจากข้อเท็จจริงเท่าที่มี โดยเชื่อว่าน่าจะเป็นแบบนั้นอย่างมีเหตุผล"},

</script>
<script>
(function(){
  const chapterSelect = document.getElementById('chapterSelect');
  const searchBox = document.getElementById('searchBox');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const card = document.getElementById('card');
  const frontTerm = document.getElementById('frontTerm');
  const chapterChip = document.getElementById('chapterChip');
  const backShort = document.getElementById('backShort');
  const backEng = document.getElementById('backEng');
  const backThai = document.getElementById('backThai');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const flipBtn = document.getElementById('flipBtn');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const wordList = document.getElementById('wordList');
  const subtitle = document.getElementById('subtitle');

  // Flatten all words with chapter tag
  let ALL = [];
  CHAPTERS.forEach(ch => {
    ch.words.forEach(w => ALL.push(Object.assign({chapter: ch.title}, w)));
  });

  let deck = ALL.slice();
  let idx = 0;
  let flipped = false;

  chapterSelect.innerHTML = '<option value="all">All chapters</option>' +
    CHAPTERS.map(c => `<option value="${c.title}">${c.title}</option>`).join('');

  subtitle.textContent = ALL.length + ' terms across ' + CHAPTERS.length + ' chapters';

  function applyFilter(){
    const chapterVal = chapterSelect.value;
    const q = searchBox.value.trim().toLowerCase();
    deck = ALL.filter(w => {
      const chOk = chapterVal === 'all' || w.chapter === chapterVal;
      const qOk = !q || w.t.toLowerCase().includes(q);
      return chOk && qOk;
    });
    idx = 0;
    flipped = false;
    render();
  }

  function shuffleDeck(){
    for(let i = deck.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    idx = 0; flipped = false; render();
  }

  function render(){
    if(deck.length === 0){
      frontTerm.textContent = 'No matches';
      chapterChip.textContent = '—';
      backShort.textContent = '';
      backEng.textContent = '';
      backThai.textContent = '';
      counter.textContent = '0 / 0';
      progressFill.style.width = '0%';
      progressLabel.textContent = 'No cards';
      renderList();
      return;
    }
    if(idx < 0) idx = deck.length - 1;
    if(idx >= deck.length) idx = 0;
    const w = deck[idx];
    frontTerm.textContent = w.t;
    chapterChip.textContent = w.chapter;
    backShort.textContent = w.short;
    backEng.textContent = w.eng;
    backThai.textContent = w.thai;
    counter.textContent = (idx+1) + ' / ' + deck.length;
    progressFill.style.width = ((idx+1)/deck.length*100) + '%';
    progressLabel.textContent = 'Card ' + (idx+1) + ' of ' + deck.length;
    card.classList.toggle('flipped', flipped);
    renderList();
  }

  function renderList(){
    wordList.innerHTML = deck.map((w,i) =>
      `<span class="word-chip ${i===idx?'current':''}" data-i="${i}">${w.t}</span>`
    ).join('');
  }

  wordList.addEventListener('click', e => {
    const chip = e.target.closest('.word-chip');
    if(!chip) return;
    idx = parseInt(chip.dataset.i, 10);
    flipped = false;
    render();
  });

  card.addEventListener('click', () => { flipped = !flipped; card.classList.toggle('flipped', flipped); });
  flipBtn.addEventListener('click', () => { flipped = !flipped; card.classList.toggle('flipped', flipped); });
  prevBtn.addEventListener('click', () => { idx--; flipped = false; render(); });
  nextBtn.addEventListener('click', () => { idx++; flipped = false; render(); });
  shuffleBtn.addEventListener('click', shuffleDeck);
  resetBtn.addEventListener('click', () => { deck = deck.slice().sort((a,b)=>0); applyFilter(); });
  chapterSelect.addEventListener('change', applyFilter);
  searchBox.addEventListener('input', applyFilter);

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight'){ idx++; flipped=false; render(); }
    else if(e.key === 'ArrowLeft'){ idx--; flipped=false; render(); }
    else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flipped=!flipped; card.classList.toggle('flipped', flipped); }
  });

  render();
})();
</script>
</body>
</html>
